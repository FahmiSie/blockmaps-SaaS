# docker-compose.yml — BASE CONFIG
services:
  db:
    image: postgres:15-alpine
    container_name: blockmaps_db
    restart: unless-stopped
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blockmaps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blockmaps}
      POSTGRES_DB: ${POSTGRES_DB:-blockmaps}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - blockmaps_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blockmaps}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
        -c max_connections=30
        -c shared_buffers=128MB
        -c effective_cache_size=384MB
        -c work_mem=2MB
        -c maintenance_work_mem=32MB

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER:-blockmaps}:${POSTGRES_PASSWORD:-blockmaps}@db:5432/${POSTGRES_DB:-blockmaps}
        DIRECT_URL: postgresql://${POSTGRES_USER:-blockmaps}:${POSTGRES_PASSWORD:-blockmaps}@db:5432/${POSTGRES_DB:-blockmaps}
        AUTH_SECRET: ${AUTH_SECRET:-generate-random-string-here}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder}
        GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
        BASE_URL: ${BASE_URL:-http://localhost:3000}
        MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-placeholder}
        MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-placeholder}
        MIDTRANS_ENV: ${MIDTRANS_ENV:-sandbox}
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-placeholder}
    container_name: blockmaps_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-blockmaps}:${POSTGRES_PASSWORD:-blockmaps}@db:5432/${POSTGRES_DB:-blockmaps}
      DIRECT_URL: postgresql://${POSTGRES_USER:-blockmaps}:${POSTGRES_PASSWORD:-blockmaps}@db:5432/${POSTGRES_DB:-blockmaps}
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - blockmaps_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:

networks:
  blockmaps_net:
    driver: bridge