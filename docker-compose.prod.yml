# docker-compose.prod.yml — VPS PRODUCTION (build lokal, self-hosted DB)
services:
  db:
    ports:
      - "0.0.0.0:5432:5432"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c work_mem=4MB
        -c maintenance_work_mem=128MB

  app:
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s