# docker-compose.prod.yml — VPS PRODUCTION (build lokal, Supabase DB)
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
        DIRECT_URL: ${DIRECT_URL}
        AUTH_SECRET: ${AUTH_SECRET}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
        NEXTAUTH_URL: ${NEXTAUTH_URL}
        BASE_URL: ${BASE_URL}
        MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
        MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY}
        MIDTRANS_ENV: ${MIDTRANS_ENV}
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
    depends_on: !reset {}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s