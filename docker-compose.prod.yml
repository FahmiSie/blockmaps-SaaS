# docker-compose.prod.yml — VPS PRODUCTION OVERRIDE
#
# Cara pakai:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Perubahan dari base docker-compose.yml:
#   - App pakai image dari Docker Hub (bukan build lokal)
#   - Resource limits dinaikkan sesuai VPS (8GB RAM, 4CPU)
#   - PostgreSQL tuning untuk production
#   - Port DB tidak di-expose ke public (keamanan)

services:
  db:
    ports: !reset
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c work_mem=4MB
        -c maintenance_work_mem=128MB
        -c random_page_cost=1.1

  app:
    # ── Pakai image dari Docker Hub, bukan build lokal ──
    image: ${DOCKER_IMAGE:-blockmaps-saas:latest}
    build: !reset null
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
